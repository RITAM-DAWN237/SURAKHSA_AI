<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="40%" stop-color="#0E1726"/>
      <stop offset="80%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#00D9F5"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00D9F5"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 245, 160, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 217, 245, 0.05)"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#00D9F5" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="topGlow" cx="20%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#00D9F5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightGlow" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#7B2CBF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(0, 245, 160, 0.15)"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .title-font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .code-font { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .text-font { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .pulse-circle { animation: pulse 3s infinite alternate ease-in-out; }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />
  <rect width="1200" height="420" rx="16" fill="url(#topGlow)" />
  <rect width="1200" height="420" rx="16" fill="url(#rightGlow)" />

  <!-- Outer Border -->
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Left Abstract AI / Radar Graphic Elements -->
  <g opacity="0.4" transform="translate(100, 210)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(0, 217, 245, 0.15)" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="90" fill="none" stroke="rgba(0, 245, 160, 0.2)" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1"/>
    <!-- Radar Sweep -->
    <path d="M 0 0 L 120 -70 A 140 140 0 0 1 140 0 Z" fill="url(#glowGrad)" opacity="0.6"/>
  </g>

  <!-- Main Content Container -->
  <g transform="translate(80, 80)">

    <!-- Top Badge -->
    <g transform="translate(0, 0)">
      <rect width="210" height="32" rx="16" fill="url(#badgeGrad)" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#00F5A0" filter="url(#glow)"/>
      <text x="30" y="21" class="code-font" font-size="12" font-weight="600" fill="#00F5A0" letter-spacing="1">NEXT-GEN SAFETY AI</text>
    </g>

    <!-- Project Title -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" class="title-font" font-size="54" fill="url(#accentCyan)" letter-spacing="-1" filter="url(#softShadow)">
        SURAKSHA AI
      </text>
      <!-- Subtitle & Description -->
      <text x="2" y="38" class="text-font" font-size="20" font-weight="500" fill="#E2E8F0">
        Intelligent Geospatial &amp; Temporal Crime Safety Risk Prediction
      </text>
      <text x="2" y="68" class="text-font" font-size="14.5" font-weight="400" fill="#94A3B8">
        Empowering citizens and smart cities with proactive risk classification using Machine Learning.
      </text>
    </g>

    <!-- Feature Pills -->
    <g transform="translate(0, 200)">
      <!-- Pill 1: Geospatial -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="10" fill="#131D31" stroke="rgba(0, 217, 245, 0.25)" stroke-width="1"/>
        <!-- Pin Icon -->
        <path d="M 18 13 C 14.7 13 12 15.7 12 19 C 12 23.5 18 29 18 29 C 18 29 24 23.5 24 19 C 24 15.7 21.3 13 18 13 Z M 18 21 C 16.9 21 16 20.1 16 19 C 16 17.9 16.9 17 18 17 C 19.1 17 20 17.9 20 19 C 20 20.1 19.1 21 18 21 Z" fill="#00D9F5"/>
        <text x="32" y="24" class="text-font" font-size="13" font-weight="500" fill="#F1F5F9">Lat/Lon Mapping</text>
      </g>

      <!-- Pill 2: Temporal -->
      <g transform="translate(195, 0)">
        <rect width="175" height="38" rx="10" fill="#131D31" stroke="rgba(0, 245, 160, 0.25)" stroke-width="1"/>
        <!-- Clock Icon -->
        <circle cx="213" cy="19" r="7" fill="none" stroke="#00F5A0" stroke-width="1.8"/>
        <polyline points="213,15 213,19 216,21" fill="none" stroke="#00F5A0" stroke-width="1.8" stroke-linecap="round"/>
        <text x="44" y="24" class="text-font" font-size="13" font-weight="500" fill="#F1F5F9">Temporal Analysis</text>
      </g>

      <!-- Pill 3: Classification -->
      <g transform="translate(385, 0)">
        <rect width="190" height="38" rx="10" fill="#131D31" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1"/>
        <!-- Shield Mini -->
        <path d="M 403 14 L 409 16.5 V 20.5 C 409 23.5 406.5 25.5 403 26.5 C 399.5 25.5 397 23.5 397 20.5 V 16.5 Z" fill="none" stroke="#C084FC" stroke-width="1.6"/>
        <text x="33" y="24" class="text-font" font-size="13" font-weight="500" fill="#F1F5F9">3-Tier Safety Index</text>
      </g>

      <!-- Pill 4: Accuracy -->
      <g transform="translate(590, 0)">
        <rect width="165" height="38" rx="10" fill="#131D31" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
        <!-- Check/Target icon -->
        <circle cx="608" cy="19" r="6.5" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
        <circle cx="608" cy="19" r="2.5" fill="#38BDF8"/>
        <text x="32" y="24" class="text-font" font-size="13" font-weight="500" fill="#F1F5F9">Random Forest</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: Shield & AI Neural Emblem -->
  <g transform="translate(940, 210)" filter="url(#softShadow)">
    <!-- Outer Floating Glow -->
    <circle cx="0" cy="0" r="110" fill="url(#shieldGrad)" opacity="0.15" filter="url(#glow)"/>

    <!-- Decorative Ring -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="rgba(0, 245, 160, 0.2)" stroke-width="1.5" stroke-dasharray="10 15"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="rgba(0, 217, 245, 0.3)" stroke-width="1" stroke-dasharray="5 5"/>

    <!-- Big Shield Background Card -->
    <path d="M 0 -70 L 65 -35 V 25 C 65 65 25 95 0 105 C -25 95 -65 65 -65 25 V -35 Z"
          fill="#0F1B2E" stroke="url(#accentCyan)" stroke-width="3" />

    <!-- Inner Shield Accent -->
    <path d="M 0 -58 L 52 -28 V 22 C 52 54 20 78 0 88 C -20 78 -52 54 -52 22 V -28 Z"
          fill="rgba(0, 245, 160, 0.05)" stroke="rgba(0, 217, 245, 0.4)" stroke-width="1.2" stroke-dasharray="6 4"/>

    <!-- Neural / AI Circuit inside Shield -->
    <g transform="translate(0, 8)">
      <!-- Core Node -->
      <circle cx="0" cy="0" r="14" fill="url(#accentCyan)" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="7" fill="#070B14"/>

      <!-- Orbiting Nodes -->
      <circle cx="-28" cy="-24" r="5" fill="#00F5A0"/>
      <circle cx="28" cy="-24" r="5" fill="#00D9F5"/>
      <circle cx="-32" cy="18" r="4.5" fill="#38BDF8"/>
      <circle cx="32" cy="18" r="4.5" fill="#A855F7"/>
      <circle cx="0" cy="38" r="5" fill="#00F5A0"/>

      <!-- Circuit Lines connecting nodes -->
      <line x1="0" y1="0" x2="-28" y2="-24" stroke="rgba(0, 245, 160, 0.7)" stroke-width="2"/>
      <line x1="0" y1="0" x2="28" y2="-24" stroke="rgba(0, 217, 245, 0.7)" stroke-width="2"/>
      <line x1="0" y1="0" x2="-32" y2="18" stroke="rgba(56, 189, 248, 0.7)" stroke-width="2"/>
      <line x1="0" y1="0" x2="32" y2="18" stroke="rgba(168, 85, 247, 0.7)" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="38" stroke="rgba(0, 245, 160, 0.7)" stroke-width="2"/>
    </g>

    <!-- Mini Status Tag -->
    <g transform="translate(0, 130)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0E192D" stroke="rgba(0, 245, 160, 0.4)" stroke-width="1"/>
      <circle cx="-45" cy="0" r="4" fill="#00F5A0"/>
      <text x="-32" y="4" class="code-font" font-size="11" font-weight="600" fill="#E2E8F0">SURAKSHA ACTIVE</text>
    </g>
  </g>
</svg>